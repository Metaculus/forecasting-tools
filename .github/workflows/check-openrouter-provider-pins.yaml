name: Check OpenRouter provider pins

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "run_bots.py"
      - "scripts/check_openrouter_provider_pins.py"

permissions:
  contents: read

jobs:
  check-provider-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ steps.setup-python.outputs.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Check every active bot's pinned endpoints are still listed
        run: uv run --no-sync python -m scripts.check_openrouter_provider_pins
